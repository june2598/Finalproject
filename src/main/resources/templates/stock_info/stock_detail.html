<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script th:src="@{/js/common.js}" defer></script>
  <script th:src="@{/js/stock-detail.js}" defer></script>
  <title>Title</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background-color: #f2f2f2;
    }
  </style>
</head>

<body>

  <th:block th:replace="~{base :: layout(pageTitle='종목 상세 정보')}">
    <th:block th:fragment="content">

      <div id="stock-detail-container"
        class="w-full h-full min-h-[100vh] bg-white flex flex-col items-center justify-between">
        <div id="detail-graph" class="w-full h-full flex-1 flex flex-col min-h-[100vh]">
          <h3 th:text="${stkNm}" class="w-full text-center"></h3>
          <iframe th:src="@{'http://localhost:8000/images/' + ${stkCode} + '_candle_' + 'default' + '_3m.html'}"
            id="stock-chart-frame" class="w-full h-full flex-1">
          </iframe>
          <div id="select-line-chart" class="w-full flex justify-end text-xl">
            <label>
              <input type="radio" name="chartType" value="pos" onclick="updateChart()" checked> 긍정점수
            </label>
            <label>
              <input type="radio" name="chartType" value="return" onclick="updateChart()"> 수익률
            </label>
          </div>
        </div>
        <div id="stock-info" class="px-6 w-full flex flex-col justify-end">
          <h1 class="font-extrabold text-xl mb-4">종목 현재 지표</h1>
          <table id="stock-detail-table">
            <thead>
              <tr>
                <th>종목명</th>
                <th>가격</th>
                <th>전일비</th>
                <th>등락률(%)</th>
                <th>거래량</th>
                <th>거래대금(백만)</th>
                <th>시가총액(억)</th>
                <th>위험도</th>
              </tr>
            </thead>
            <tbody>
              <!-- 데이터가 여기에 삽입됩니다. -->
            </tbody>
          </table>
        </div>
        <div id="stock-news-container" class="px-6 pt-6 pb-2 w-full h-full flex flex-col justify-end">
          <h1 class="font-extrabold text-xl mb-4">종목 관련 뉴스</h1>
          <table id="stock-news-table">
            <thead>
              <tr>
                <th class="text-sm w-7/10">제목</th>
                <th class="text-sm text-center w-1/10">정보 제공</th>
                <th class="text-sm text-center w-2/10">날짜</th>
              </tr>
            </thead>
            <tbody>
              <!-- 주식 데이터 -->
            </tbody>
          </table>
        </div>
      </div>
    </th:block>
  </th:block>
</body>

</html>
