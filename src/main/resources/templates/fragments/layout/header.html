<th:block th:fragment="header">
  <div class="min-h-[6vh] bg-white p-2 text-black flex justify-between items-center">
    <a th:href="@{/}" class="font-extrabold text-xl">스마트투자</a> <!-- 링크 추가 -->
    <span>
        <ul th:if="${session.loginOkMember == null}" class="flex font-bold">
          <li>
            <a th:href="@{/login}">로그인</a>
          </li>
          <li>
            <a th:href="@{/register}" class="ml-4 font-bold">회원가입</a> <!-- 회원가입 링크 추가 -->
          </li>
        </ul>
        <div class="loginOK" th:if="${!session.isEmpty()}">
          <div class="userinfo" th:if="${session.loginOkMember != null}">
            <a th:if="${session.loginOkMember != null and session.loginOkMember.memberClsfc == '관리자'}"
                  th:text="${session.loginOkMember.memberClsfc}" class="text-red-500 font-bold hover:underline cursor-hover"
                th:href="@{/admin}">
            </a>
            <span th:text="${session.loginOkMember.memberId} + '님 반갑습니다.'"></span>
            <span><a th:href="@{/logout}">로그아웃</a></span>
          </div>
        </div>
      </span>
  </div>
</th:block>
